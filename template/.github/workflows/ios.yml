name: iOS 构建并上传 TestFlight

# 只手动触发。这里踩过一次坑，别再改回去：
#
#   原来挂了 push: branches: [main]，结果每次改文档、改注释、甚至改错一行
#   Swift 的提交，都会自动跑一遍完整的签名 + 上传，白烧一个 build 号。
#   连着三次提交就吃掉了 1/2/3，其中 build 1 的 Swift 根本编不过也照样
#   占了号。等真要发一个能用的包时，Apple 报：
#     ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE
#     The bundle version must be higher than the previously uploaded version: '3'
#
#   上传是不可撤销的，占掉的号拿不回来。所以上传必须是有意为之的动作：
#   改好 project.yml 里的 CURRENT_PROJECT_VERSION，再手动点运行。
#
# 想编译验证（不上传签名）用 validate.yml，那个挂在 push 上、不花 build 号。
on:
  workflow_dispatch:

jobs:
  build:
    # 必须是 macOS runner。GitHub 提供的是真 Mac 云机，这就是"没有 Mac 也能编 iOS"的全部秘密。
    runs-on: macos-latest
    timeout-minutes: 40
    # 项目相关的值集中在这里，换项目只改这四行。
    #
    #   PROJECT  = project.yml 里的 name:，也就是 .xcodeproj 的名字
    #   SCHEME   = project.yml 里 schemes: 下的 key
    #   APP_NAME = target 名（决定 .ipa 的文件名）
    #   BUNDLE_ID = PRODUCT_BUNDLE_IDENTIFIER，也用于 ExportOptions 里配描述文件
    #
    # 四者经常同名，但不是必须同名 —— 这几个值对不上是这类流水线最常见的
    # 失败原因，所以宁可多一行也别混着用。
    env:
      PROJECT: MyApp
      SCHEME: MyApp
      APP_NAME: MyApp
      BUNDLE_ID: com.example.myapp

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      # 环境信息放最前面：每次运行都能看到 runner 给的是什么系统、什么 Xcode。
      # App Store 对 SDK 版本有要求，这个信息越早知道越好。
      - name: 环境自曝
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          echo "--- 可用 SDK ---"
          xcodebuild -showsdks 2>/dev/null | grep -i "iOS" || true
          ruby --version

      # 再查 secrets。缺了的话直接说清楚缺哪个，
      # 而不是让人对着 "SecKeychainItemImport: The user name or passphrase..." 这种报错发愣。
      - name: 检查 Secrets 是否配好
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_CONTENT }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          # 用 if 而不是 `[ -z "$X" ] && missing=...`：
          # 后者在 bash 里其实不会触发 set -e（&& 列表非末尾的命令受保护），
          # 但那个规则太绕，写成 if 一眼就能看懂。
          if [ -z "$CERT" ];    then missing="$missing  IOS_CERT_P12_BASE64"; fi
          if [ -z "$PROFILE" ]; then missing="$missing  IOS_PROFILE_BASE64"; fi
          if [ -z "$ASC_KEY" ]; then missing="$missing  ASC_KEY_CONTENT"; fi
          if [ -z "$TEAM" ];    then missing="$missing  APPLE_TEAM_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::还缺这几个 Secrets：$missing"
            echo "## 还缺 Secrets" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "缺：\`$missing\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "照 \`tools/ship.py secrets\` 打印的清单，在仓库 Settings → Secrets and variables → Actions 里补齐。" >> "$GITHUB_STEP_SUMMARY"
            echo "全部填完再点一次 Run workflow。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Secrets 齐了，继续。"

      - name: 装 XcodeGen
        run: brew install xcodegen

      # ---------- 签名材料 ----------
      # 证书私钥是在你 Windows 上生成的，CI 只负责"导入"，绝不"创建"。
      # 让 CI 创建证书 = 私钥生在几分钟后就被销毁的机器上，Apple 那边多一张永远用不了的证书，
      # 而每个账号的发布证书名额是有限的。这条坑有人踩过，为此废掉三个名额。
      - name: 导入签名证书
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          printf '%s' "$CERT_P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"

          # 诊断：只打 base64 长度和解码后的字节数。
          # 这两个数不涉及任何密钥材料，但能把「解码坏了」和「密码不对」区分开——
          # 字节数明显偏小说明 base64 传输时被截断了，字节数正常但下面校验失败才是密码问题。
          #
          # ⚠️ 绝对不要在这里输出密码本身，也不要输出长度/首字符/末字符。
          #    GitHub 的 secret 遮蔽只替换「完整的 secret 值」；`${#VAR}`、`${VAR:0:1}`
          #    这类切片不会被遮蔽，会原样写进日志。而公开仓库的 Actions 日志任何人可读，
          #    密码长度 + 首尾字符会把爆破空间缩掉一大截。
          echo "p12 base64 长度: ${#CERT_P12_BASE64}"
          echo "解码后字节数: $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ')"

          # 在 import 之前先单独验一次密码，失败信息比 security 的清楚。
          # stderr 全部丢弃——只需要「能不能打开」这个布尔结果，不需要 openssl 的细节。
          if openssl pkcs12 -info -noout -in "$RUNNER_TEMP/cert.p12" \
               -passin "pass:$CERT_PASSWORD" 2>/dev/null; then
            echo "PKCS12 密码校验: 通过"
          else
            echo "::error::p12 解码出来了，但这个密码打不开它。值在传输中被改过，或者写入时用的是另一个密码。"
            exit 1
          fi

          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # 少了这一行，codesign 会弹一个没人能点的 GUI 授权框，然后卡到超时。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null

          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: 安装描述文件
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------- 生成工程 ----------
      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          xcodegen generate
          # 生成完立刻列一遍 scheme。scheme 名字对不上是这里最常见的失败原因，
          # 与其等 archive 阶段报一个含糊的错，不如现在就说清楚。
          xcodebuild -list -project "$PROJECT.xcodeproj"

      # ---------- 编译归档 ----------
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            COMPILER_INDEX_STORE_ENABLE=NO

      # ---------- 导出 ipa ----------
      - name: 导出 IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

          ls -la "$RUNNER_TEMP/export"

      # ---------- 上传 ----------
      # 用 fastlane 上传，不用 altool：altool 早就被标记废弃，Xcode 版本一换就可能消失。
      - name: 上传到 TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IPA_PATH: ${{ runner.temp }}/export/${{ env.APP_NAME }}.ipa
        run: |
          set -euo pipefail
          # 用 bundler 而不是 gem install fastlane：
          # runner 是 Ruby 3.4，fastlane 依赖的 mutex_m / base64 已经不在默认 gem 里，
          # 这些依赖在 Gemfile 里显式声明了。
          gem install bundler --no-document
          bundle install --quiet
          bundle exec fastlane --version
          bundle exec fastlane upload

      - name: 失败时把关键产物留下来
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/*.xcarchive/Info.plist
          retention-days: 3
